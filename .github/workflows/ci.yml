# Checks that need no GPU, MuJoCo, JAX or brax: byte-compilation, the claims check
# (every number in README / archived report / media/README.md recomputed from committed files), the
# technical report's number check (every number in report/report_en.tex found in its source file) and the
# pytest suite (characterization goldens, keyword rule, scene generator, Navigator, CLI parsers,
# dashboards' first render, committed artifacts, English-only text). The simulation checks
# (tests/test_sim_rerun.py) are opt-in and skipped here.
name: ci
on:
  push:
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (package + test and dashboard extras; no simulator)
        run: python -m pip install -e ".[test,dashboard]"
      - name: Byte-compile every Python file
        run: python -m compileall -q -x '/\.git/' .
      - name: Claims check (README, archived report, media/README.md)
        run: python -m analysis.verify_claims
      - name: Report number check (report/report_en.tex)
        run: python -m analysis.verify_report
      - name: Tests
        run: python -m pytest -q tests
